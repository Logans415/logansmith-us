# Publishes the repo to GitHub Pages exactly as committed, plus a generated
# health.json that names the deployed commit. No build step, no site dependencies.
# Actions are GitHub's own, pinned to full commit SHAs.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write health.json
        run: printf '{"status":"ok","commit":"%s"}\n' "$GITHUB_SHA" > health.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true # keeps .well-known/ and .nojekyll; .git and .github are always excluded

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
